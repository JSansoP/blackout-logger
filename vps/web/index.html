<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Blackout Logger</title>
  <script>
    if (!location.pathname.endsWith("/")) location.replace(location.pathname + "/" + location.search + location.hash);
    try {
      const theme = localStorage.getItem("theme");
      if (theme === "light" || theme === "dark") document.documentElement.dataset.theme = theme;
    } catch {}
  </script>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%2315191b'/%3E%3Cpath d='M18 5l-8 13h6l-2 9 8-13h-6z' fill='%23eb6834'/%3E%3C/svg%3E">
  <link rel="preload" href="static/vendor/archivo-latin-wdth.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="static/app.css">
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="./">
        <svg viewBox="0 0 32 32" aria-hidden="true"><path d="M18 5l-8 13h6l-2 9 8-13h-6z" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"/></svg>
        Blackout Logger
      </a>
      <div class="topbar-end">
        <span class="checked" id="checked" aria-live="polite"></span>
        <button class="button ghost icon-button" id="theme-button" type="button" aria-label="Switch theme" title="Switch theme">
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><circle cx="8" cy="8" r="5.5"/><path d="M8 2.5v11a5.5 5.5 0 0 0 0-11z" fill="currentColor"/></svg>
        </button>
      </div>
    </div>
  </header>

  <main id="view" class="view">
    <section class="readouts" id="readouts" aria-label="Current status">
      <div class="readout readout-status"><div class="skeleton-line"></div></div>
      <div class="readout"><div class="skeleton-line"></div></div>
      <div class="readout"><div class="skeleton-line"></div></div>
    </section>

    <div class="view-head">
      <h1 id="range-title">Last 30 days</h1>
      <div class="segmented" id="range" role="group" aria-label="Time range">
        <button type="button" data-days="7">7 d</button>
        <button type="button" data-days="30">30 d</button>
        <button type="button" data-days="90">90 d</button>
      </div>
    </div>

    <section class="panel" aria-labelledby="map-title">
      <div class="panel-head">
        <h2 id="map-title">When the outages happened</h2>
        <p>One row per day, midnight to midnight, in your local time.</p>
      </div>
      <div class="map" id="map"></div>
      <div class="key" aria-hidden="true">
        <span><i class="type-power"></i>Power</span>
        <span><i class="type-internet"></i>Internet</span>
        <span><i class="type-stuck"></i>Pi stuck, length unknown</span>
        <span><i class="type-unknown"></i>Unknown</span>
      </div>
    </section>

    <section class="panel" aria-labelledby="list-title">
      <div class="panel-head">
        <h2 id="list-title">Outages</h2>
        <p>Start is the last successful check, so durations can be up to 10 min too long.</p>
      </div>
      <div class="table-wrap" id="list"></div>
    </section>
  </main>

  <script type="module" src="static/app.js"></script>
</body>
</html>
